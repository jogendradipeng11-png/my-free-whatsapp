<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#075e54">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>FreeChat P2P - WhatsApp & IMO Clone</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b141a;
      color: #e9edef;
    }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    .hidden { display: none !important; }

    /* Modal Overlay for Phone Authentication */
    #auth-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #111b21;
      border: 1px solid #2a3942;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .app { display: flex; width: 100%; height: 100%; }
    .side {
      width: 360px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      background: #111b21;
      border-right: 1px solid #2a3942;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 14px;
      background: #202c33;
    }
    .title {
      overflow: hidden;
      color: #25d366;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn {
      padding: 8px 11px;
      border-radius: 7px;
      background: #075e54;
      color: #fff;
      font-size: 13px;
    }
    .btn:hover { background: #0b806f; }
    .contacts { flex: 1; overflow-y: auto; }
    .contact {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid #26343c;
      cursor: pointer;
    }
    .contact:hover { background: #202c33; }
    .avatar {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 50%;
      background: #25d366;
      color: #111;
      font-weight: bold;
    }
    .chat {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      background: #0b141a;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background-image: radial-gradient(#1d2a31 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .message {
      max-width: min(78%, 480px);
      margin: 8px 0;
      padding: 9px 11px;
      border-radius: 8px;
      background: #202c33;
      word-break: break-word;
    }
    .mine { margin-left: auto; background: #005c4b; }
    .meta {
      margin-top: 5px;
      color: #aebac1;
      font-size: 10px;
      text-align: right;
    }
    .message img, .message video {
      max-width: 100%;
      max-height: 300px;
      margin-top: 7px;
      border-radius: 7px;
    }
    .message audio { width: 100%; margin-top: 7px; }
    .inputbar {
      display: flex;
      gap: 7px;
      padding: 10px;
      background: #202c33;
    }
    .inputbar input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      outline: none;
      background: #2a3942;
      color: #fff;
    }
    .call-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
    }
    #remoteVideo { width: 100%; height: 100%; background: #111; object-fit: cover; }
    #localVideo {
      position: absolute;
      right: 14px;
      bottom: 90px;
      width: 120px;
      height: 170px;
      border: 2px solid #25d366;
      border-radius: 10px;
      background: #111;
      object-fit: cover;
    }
    .call-status {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 9px 12px;
      border-radius: 20px;
      background: #000a;
      color: #25d366;
    }
    .end-call {
      position: absolute;
      bottom: 22px;
      left: 50%;
      padding: 13px 28px;
      border-radius: 28px;
      transform: translateX(-50%);
      background: #d93025;
      color: #fff;
      font-weight: bold;
    }
    @media (max-width: 700px) {
      .side { width: 100%; }
      .chat { display: none; }
      .chat.mobile-open {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
      }
    }
  </style>
</head>

<body>
  <!-- Phone Verification Login Modal -->
  <div id="auth-modal">
    <div class="auth-card">
      <h2 style="color: #25d366; margin-top: 0; font-size: 1.2rem;">📱 FreeChat Verification</h2>
      
      <div id="step-phone">
        <p style="font-size: 13px; color: #aebac1;">Enter your phone number to sign in:</p>
        <input id="input-phone" type="text" value="+966500000000" style="width:100%; padding:10px; background:#2a3942; border:1px solid #374248; color:#fff; border-radius:6px; margin-bottom:12px; outline:none;">
        <button id="btn-send-code" class="btn" style="width:100%; padding:10px;">Send Demo Code</button>
      </div>

      <div id="step-code" class="hidden">
        <p style="font-size: 13px; color: #aebac1;">Enter the 6-digit code sent to your phone <br><small style="color:#25d366;">(Demo Code: 482913)</small>:</p>
        <input id="input-code" type="text" placeholder="482913" maxlength="6" style="width:100%; padding:10px; background:#2a3942; border:1px solid #374248; color:#fff; border-radius:6px; margin-bottom:12px; outline:none; text-align:center; font-size:18px; letter-spacing:4px;">
        <button id="btn-verify-code" class="btn" style="width:100%; padding:10px;">Verify & Login</button>
      </div>
    </div>
  </div>

  <div class="app">
    <aside class="side">
      <div class="top">
        <div id="meLabel" class="title">Connecting…</div>
        <div>
          <button class="btn" id="addContactBtn">+ Contact</button>
          <button class="btn" id="installBtn" style="display: none;">Install</button>
        </div>
      </div>
      <div id="contactList" class="contacts"></div>
    </aside>

    <main id="chatPanel" class="chat">
      <div class="top">
        <button class="btn" id="backBtn">←</button>
        <div id="chatTitle" class="title">Select a contact</div>
        <div>
          <button class="btn" id="audioCallBtn" title="Audio call">📞</button>
          <button class="btn" id="videoCallBtn" title="Video call">🎥</button>
        </div>
      </div>

      <div id="messages" class="messages">
        <p style="text-align: center; color: #aebac1;">Add or select a contact to start chatting.</p>
      </div>

      <div class="inputbar">
        <input id="fileInput" type="file" hidden accept="image/*,video/*,audio/*">
        <button class="btn" id="fileBtn" title="Send media">📎</button>
        <button class="btn" id="locationBtn" title="Share location">📍</button>
        <button class="btn" id="recordBtn" title="Voice note">🎙️</button>
        <input id="messageInput" type="text" placeholder="Type a message" autocomplete="off">
        <button class="btn" id="sendBtn">Send</button>
      </div>
    </main>
  </div>

  <section id="callScreen" class="call-screen hidden">
    <video id="remoteVideo" autoplay playsinline></video>
    <audio id="remoteAudio" autoplay playsinline></audio>
    <video id="localVideo" autoplay muted playsinline></video>
    <div id="callStatus" class="call-status">Connecting…</div>
    <button id="endCallBtn" class="end-call">End call</button>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, get, onValue, onChildAdded, update, remove, query, orderByChild, equalTo, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8OyQ99giriQ_v0RpBaXoRFcAeM53CufQ",
      authDomain: "my-free-whatsapp.firebaseapp.com",
      databaseURL: "https://my-free-whatsapp-default-rtdb.firebaseio.com",
      projectId: "my-free-whatsapp",
      storageBucket: "my-free-whatsapp.firebasestorage.app",
      messagingSenderId: "330905353783",
      appId: "1:330905353783:web:4238c64b5b664689a209b2",
      measurementId: "G-QL2ECLS16G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let me = null;
    let userPhone = "+966500000000";
    let selectedContact = null;

    let unsubscribeMessages = null;
    let callUnsubscribe = null;
    let candidateUnsubscribe = null;
    let pc = null;
    let localStream = null;
    let activeCallId = null;
    let recorder = null;
    let recordingChunks = [];
    let deferredPrompt = null;
    let pendingIceCandidates = [];
    let isClosingCall = false;

    const $ = (id) => document.getElementById(id);

    function roomId(uidA, uidB) {
      return [uidA, uidB].sort().join("_");
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      $("installBtn").style.display = "inline-block";
    });

    $("installBtn").onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      $("installBtn").style.display = "none";
    };

    // Phone Verification Flow
    $("btn-send-code").onclick = () => {
      const enteredPhone = $("input-phone").value.trim();
      if (!enteredPhone) {
        alert("Please enter a valid phone number.");
        return;
      }
      userPhone = enteredPhone;
      $("step-phone").classList.add("hidden");
      $("step-code").classList.remove("hidden");
    };

    $("btn-verify-code").onclick = async () => {
      const code = $("input-code").value.trim();
      if (code !== "482913") {
        alert("Invalid demo code. Please use 482913");
        return;
      }

      $("auth-modal").classList.add("hidden");
      await boot();
    };

    async function boot() {
      await signInAnonymously(auth);
      me = auth.currentUser;

      $("meLabel").textContent = `${userPhone} · UID: ${me.uid.slice(0, 8)}…`;

      const myUserRef = ref(db, `users/${me.uid}`);
      await set(myUserRef, {
        uid: me.uid,
        phone: userPhone,
        name: `User ${userPhone.slice(-4)}`,
        online: true,
        updatedAt: Date.now()
      });

      onDisconnect(myUserRef).update({
        online: false,
        updatedAt: Date.now()
      });

      loadContacts();
      listenForIncomingCalls();
    }

    function loadContacts() {
      onValue(ref(db, `userContacts/${me.uid}`), (snapshot) => {
        const list = $("contactList");
        list.innerHTML = "";

        if (!snapshot.exists()) {
          list.innerHTML = `<p style="padding:16px;color:#aebac1;font-size:13px;">No contacts yet. Tap “+ Contact” and enter another user's Firebase UID.</p>`;
          return;
        }

        snapshot.forEach((child) => {
          const contact = child.val();
          const row = document.createElement("div");
          row.className = "contact";

          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = (contact.phone || "?").slice(-2);

          const details = document.createElement("div");
          const contactName = document.createElement("strong");
          contactName.textContent = contact.phone || "Unknown user";

          const status = document.createElement("div");
          status.style.fontSize = "12px";
          status.style.color = "#aebac1";
          status.textContent = "Tap to chat";

          details.append(contactName, status);
          row.append(avatar, details);
          row.onclick = () => openChat(contact);
          list.appendChild(row);
        });
      });
    }

    $("addContactBtn").onclick = async () => {
      const uid = String(prompt("Paste the contact Firebase UID:")).trim();
      if (!uid || uid === "null") return;
      if (uid === me.uid) { alert("You cannot add yourself."); return; }

      try {
        const userSnapshot = await get(ref(db, `users/${uid}`));
        const user = userSnapshot.val();

        if (!user) {
          alert("User not found in database.");
          return;
        }

        await set(ref(db, `userContacts/${me.uid}/${uid}`), {
          uid,
          phone: user.phone || "Unknown",
          addedAt: Date.now()
        });

        alert("Contact added successfully.");
      } catch (error) {
        alert("Unable to add contact: " + error.message);
      }
    };

    function openChat(contact) {
      selectedContact = contact;
      $("chatTitle").textContent = `Chat with ${contact.phone || "Unknown"}`;
      $("chatPanel").classList.add("mobile-open");
      $("messages").innerHTML = "";

      unsubscribeMessages?.();
      unsubscribeMessages = null;

      const room = roomId(me.uid, contact.uid);
      unsubscribeMessages = onChildAdded(ref(db, `chats/${room}/messages`), (snapshot) => {
        renderMessage(snapshot.val());
      });
    }

    $("backBtn").onclick = () => $("chatPanel").classList.remove("mobile-open");

    function renderMessage(message) {
      const box = document.createElement("div");
      box.className = `message ${message.senderUid === me.uid ? "mine" : ""}`;

      if (message.type === "image") {
        const img = document.createElement("img");
        img.src = message.content;
        box.appendChild(img);
      } else if (message.type === "video") {
        const vid = document.createElement("video");
        vid.src = message.content;
        vid.controls = true;
        box.appendChild(vid);
      } else if (message.type === "audio") {
        const aud = document.createElement("audio");
        aud.src = message.content;
        aud.controls = true;
        box.appendChild(aud);
      } else {
        const text = document.createElement("div");
        text.textContent = message.content || "";
        box.appendChild(text);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = new Date(message.timestamp || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      box.appendChild(meta);

      $("messages").appendChild(box);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    async function sendMessage(type, content) {
      if (!selectedContact) return alert("Select a contact first.");
      const room = roomId(me.uid, selectedContact.uid);
      await push(ref(db, `chats/${room}/messages`), {
        senderUid: me.uid,
        receiverUid: selectedContact.uid,
        type,
        content,
        timestamp: Date.now()
      });
    }

    async function sendText() {
      const input = $("messageInput");
      const text = input.value.trim();
      if (!text) return;
      await sendMessage("text", text);
      input.value = "";
    }

    $("sendBtn").onclick = sendText;
    $("messageInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendText(); } });

    $("fileBtn").onclick = () => {
      if (!selectedContact) return alert("Select a contact first.");
      $("fileInput").click();
    };

    // Base64 File Handler (No Storage Required)
    $("fileInput").onchange = (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file || !selectedContact) return;

      if (file.size > 2 * 1024 * 1024) {
        alert("File size limit for direct chat is 2MB.");
        return;
      }

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onloadend = async () => {
        const type = file.type.startsWith("image/") ? "image" : file.type.startsWith("video/") ? "video" : "audio";
        await sendMessage(type, reader.result);
      };
    };

    $("locationBtn").onclick = () => {
      if (!selectedContact) return alert("Select a contact first.");
      navigator.geolocation.getCurrentPosition((pos) => {
        const mapsUrl = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        sendMessage("text", `📍 Location: ${mapsUrl}`);
      }, () => alert("Location permission denied."));
    };

    $("recordBtn").onclick = async () => {
      if (!selectedContact) return alert("Select a contact first.");
      if (!recorder || recorder.state === "inactive") {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordingChunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (e) => recordingChunks.push(e.data);
        recorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(recordingChunks, { type: "audio/webm" });
          if (blob.size > 1 * 1024 * 1024) {
            alert("Voice note is too large.");
            return;
          }
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = async () => {
            await sendMessage("audio", reader.result);
          };
        };
        recorder.start();
        $("recordBtn").textContent = "⏹";
      } else {
        recorder.stop();
        $("recordBtn").textContent = "🎙️";
      }
    };

    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function createPeerConnection(audioOnly, callId, isCaller) {
      if (pc) { pc.close(); pc = null; }
      pc = new RTCPeerConnection(rtcConfig);

      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: !audioOnly });
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      $("localVideo").srcObject = localStream;
      $("localVideo").style.display = audioOnly ? "none" : "block";

      pc.ontrack = (event) => {
        const remoteStream = event.streams[0];
        if (!remoteStream) return;
        $("remoteAudio").srcObject = remoteStream;
        if (!audioOnly) $("remoteVideo").srcObject = remoteStream;
        $("callStatus").textContent = "Connected";
      };

      pc.onicecandidate = async (event) => {
        if (!event.candidate || !activeCallId) return;
        const side = isCaller ? "callerCandidates" : "calleeCandidates";
        await push(ref(db, `calls/${callId}/${side}`), event.candidate.toJSON());
      };

      pc.onconnectionstatechange = () => {
        if (!isClosingCall && (pc?.connectionState === "failed" || pc?.connectionState === "disconnected")) {
          closeCall(false);
        }
      };
    }

    async function addPendingIceCandidates() {
      if (!pc?.remoteDescription || !pendingIceCandidates.length) return;
      const candidates = [...pendingIceCandidates];
      pendingIceCandidates = [];
      for (const c of candidates) {
        await pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      }
    }

    function listenForCandidates(callId, isCaller) {
      const remoteSide = isCaller ? "calleeCandidates" : "callerCandidates";
      candidateUnsubscribe?.();
      candidateUnsubscribe = onChildAdded(ref(db, `calls/${callId}/${remoteSide}`), async (snapshot) => {
        const candidate = snapshot.val();
        if (!candidate || !pc) return;
        if (pc.remoteDescription) {
          await pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
        } else {
          pendingIceCandidates.push(candidate);
        }
      });
    }

    async function startCall(audioOnly) {
      if (!selectedContact) return alert("Select a contact to call.");
      if (activeCallId) return alert("Call already active.");

      activeCallId = crypto.randomUUID();
      pendingIceCandidates = [];
      isClosingCall = false;

      $("callScreen").classList.remove("hidden");
      $("callStatus").textContent = "Calling…";

      await createPeerConnection(audioOnly, activeCallId, true);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await set(ref(db, `calls/${activeCallId}`), {
        callerUid: me.uid,
        callerPhone: userPhone,
        calleeUid: selectedContact.uid,
        audioOnly,
        status: "ringing",
        offer: { type: offer.type, sdp: offer.sdp },
        createdAt: Date.now()
      });

      listenForCandidates(activeCallId, true);

      callUnsubscribe = onValue(ref(db, `calls/${activeCallId}`), async (snapshot) => {
        const call = snapshot.val();
        if (!call || call.status === "rejected" || call.status === "ended") {
          closeCall(false);
          return;
        }
        if (call.answer && !pc?.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(call.answer));
          await addPendingIceCandidates();
          $("callStatus").textContent = "Connecting…";
        }
      });
    }

    $("audioCallBtn").onclick = () => startCall(true);
    $("videoCallBtn").onclick = () => startCall(false);

    function listenForIncomingCalls() {
      const incomingQuery = query(ref(db, "calls"), orderByChild("calleeUid"), equalTo(me.uid));
      onValue(incomingQuery, async (snapshot) => {
        for (const child of snapshot.children) {
          const call = child.val();
          const callId = child.key;
          if (!call?.offer || call.status !== "ringing" || activeCallId) continue;

          if (confirm(`Incoming call from ${call.callerPhone || "Unknown"}. Accept?`)) {
            activeCallId = callId;
            pendingIceCandidates = [];
            isClosingCall = false;

            $("callScreen").classList.remove("hidden");
            $("callStatus").textContent = "Connecting…";

            await createPeerConnection(call.audioOnly, callId, false);
            await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
            await addPendingIceCandidates();

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await update(ref(db, `calls/${callId}`), {
              answer: { type: answer.type, sdp: answer.sdp },
              status: "accepted"
            });

            listenForCandidates(callId, false);

            callUnsubscribe = onValue(ref(db, `calls/${callId}/status`), (snap) => {
              if (snap.val() === "ended" || snap.val() === "rejected") closeCall(false);
            });
          } else {
            await update(ref(db, `calls/${callId}`), { status: "rejected" });
          }
        }
      });
    }

    async function closeCall(notifyRemote = true) {
      if (isClosingCall) return;
      isClosingCall = true;
      const callId = activeCallId;

      callUnsubscribe?.();
      candidateUnsubscribe?.();
      callUnsubscribe = null;
      candidateUnsubscribe = null;
      pendingIceCandidates = [];

      if (notifyRemote && callId) {
        await update(ref(db, `calls/${callId}`), { status: "ended" }).catch(() => {});
        setTimeout(() => remove(ref(db, `calls/${callId}`)).catch(() => {}), 4000);
      }

      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }

      $("remoteVideo").srcObject = null;
      $("remoteAudio").srcObject = null;
      $("localVideo").srcObject = null;
      $("callScreen").classList.add("hidden");

      activeCallId = null;
      isClosingCall = false;
    }

    $("endCallBtn").onclick = () => closeCall(true);
  </script>
</body>
</html>
